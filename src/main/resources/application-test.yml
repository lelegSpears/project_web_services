  spring:
    datasource:
      url: jdbc:h2:mem:testdb
      username: sa
      password:
      driver-class-name: org.h2.Driver
    data:
      web:
        pageable:
          default-page-size: 10
          max-page-size: 50

    h2:
      console:
        enabled: true
        path: /h2-console
        settings:
          web-allow-others: true

    jpa:
      hibernate:
        ddl-auto: create
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  server:
    port: 8080

  jwt:
    secret: "12345678910!uma-chave-boa12345678910!"
    expiration: 86400000